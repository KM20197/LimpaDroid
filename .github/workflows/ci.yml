name: Build & Unit Tests (CI)

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint, Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (API 37)
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 17 SDK Platform & Build Tools
        run: |
          set -euo pipefail
          yes | sdkmanager --channel=3 --licenses > /dev/null || true
          AVAILABLE=$(sdkmanager --list --channel=3)
          PLATFORM_PKG=$(echo "$AVAILABLE" | awk '{print $1}' | grep -E '^platforms;android-37$' | head -n 1 || true)
          if [ -z "$PLATFORM_PKG" ]; then
            echo "Pacote platforms;android-37 nao encontrado no canal Canary (--channel=3). Plataformas disponiveis:"
            echo "$AVAILABLE" | grep 'platforms;android-' || true
            exit 1
          fi
          BUILD_TOOLS_PKG=$(echo "$AVAILABLE" | awk '{print $1}' | grep -E '^build-tools;37\.' | sort -V | tail -n 1 || true)
          if [ -z "$BUILD_TOOLS_PKG" ]; then
            BUILD_TOOLS_PKG="build-tools;36.0.0"
          fi
          echo "Installing $PLATFORM_PKG and $BUILD_TOOLS_PKG"
          sdkmanager --channel=3 "$PLATFORM_PKG" "$BUILD_TOOLS_PKG"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Prepare debug keystore and gradlew
        run: |
          base64 -d debug.keystore.base64 > debug.keystore
          chmod +x gradlew

      - name: Run Lint, Debug Unit Tests & Assemble Debug APK
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: limpadroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
