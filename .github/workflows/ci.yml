name: Build & Unit Tests (CI)

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint, Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (API 37)
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 17 SDK Platform & Build Tools
        run: |
          set -euo pipefail
          yes | sdkmanager --channel=3 --licenses > /dev/null || true
          sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Prepare debug keystore and gradlew
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          chmod +x gradlew

      - name: Run Lint, Debug Unit Tests & Assemble Debug APK
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: limpadroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
