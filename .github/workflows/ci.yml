name: Build & Unit Tests (CI)

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint, Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 37)
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 17 SDK Platform & Build Tools
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: "9.3.1"

      - name: Run Lint, Debug Unit Tests & Assemble Debug APK
        run: gradle lint testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: limpadroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
